name = "lugat-quiz-bot"
main = "index.js"
compatibility_date = "2025-04-01"

[vars]
# 1-majburiy kanal
CHANNEL = "@Turk_tili_Milliy_va_TYS"
# 2-majburiy kanal: yangi testlar shu yerga avtomatik joylanadi
TESTS_CHANNEL = "@MyLingoUP_BOT_testlari"
# Bot muallifi (reklama, yo'riqnoma va muallif testlarini boshqaradi)
AUTHOR = "@Shehroz_hoca"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "Chat"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[durable_objects.bindings]]
name = "CASTER"
class_name = "Caster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Chat", "Store"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Caster"]
